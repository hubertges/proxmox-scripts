# system-config/grub-tuning.conf
# Recommended Linux Kernel Boot Parameters for Cisco TRex Benchmarking Host
# Location in system: /etc/default/grub.d/99-trex-performance.cfg (or /etc/default/grub)
#
# After modifying, update GRUB:
#   sudo update-grub

# ------------------------------------------------------------------------------
# 1. BARE-METAL / DEDICATED HYPERVISOR DEPLOYMENT
# ------------------------------------------------------------------------------
# Assumes a 16-core system where:
# - Cores 0-1: OS management, interrupts, SSH, monitoring
# - Cores 2-3: TRex master thread and latency thread
# - Cores 4-15: TRex DPDK worker threads (packet generation)
#
# GRUB_CMDLINE_LINUX_DEFAULT="quiet intel_iommu=on iommu=pt default_hugepagesz=2M hugepagesz=2M hugepages=2048 isolcpus=4-15 nohz_full=4-15 rcu_nocbs=4-15 nosoftlockup mce=ignore_ce processor.max_cstate=1 intel_idle.max_cstate=0 idle=poll"

# ------------------------------------------------------------------------------
# 2. PROXMOX VE VIRTUAL MACHINE (GUEST DEPLOYMENT)
# ------------------------------------------------------------------------------
# For a Proxmox VM with 8 vCPUs assigned:
# - vCPUs 0-1: Host OS / TRex master (core 0) & Latency thread (core 1)
# - vCPUs 2-7: DPDK traffic workers
#
# Note: For VirtIO-Net without hardware IOMMU, pass vfio.enable_unsafe_noiommu_mode=1
#
# GRUB_CMDLINE_LINUX_DEFAULT="quiet default_hugepagesz=2M hugepagesz=2M hugepages=2048 isolcpus=2-7 nohz_full=2-7 rcu_nocbs=2-7 intel_iommu=on iommu=pt"

# ------------------------------------------------------------------------------
# PARAMETER JUSTIFICATIONS (ACADEMIC RIGOR):
# ------------------------------------------------------------------------------
# - intel_iommu=on / amd_iommu=on: Enables hardware I/O Virtualization (VT-d / AMD-Vi)
#   required for VFIO driver isolation and DMA direct memory access.
# - iommu=pt: Pass-through mode for IOMMU avoids emulation overhead on host devices.
# - default_hugepagesz=2M hugepagesz=2M hugepages=2048:
#   Pre-allocates 4GB of 2MB hugepages at boot time before memory gets fragmented.
# - isolcpus=<cores>: Removes specified CPU cores from the Linux kernel CFS scheduler.
#   Only threads explicitly pinned with pthread_setaffinity (such as DPDK poll-mode
#   threads) will execute on these cores, guaranteeing 0% jitter from kernel tasks.
# - nohz_full=<cores>: Disables the periodic kernel scheduler timer ticks on isolated
#   cores whenever only one runnable task is present (adaptive-ticks mode).
# - rcu_nocbs=<cores>: Offloads Read-Copy-Update (RCU) callback processing to
#   non-isolated cores, eliminating latency spikes during packet generation loops.
# - processor.max_cstate=1 / intel_idle.max_cstate=0:
#   Prevents deep CPU sleep states (C-states), eliminating CPU wake-up latency penalties
#   that distort microsecond-level latency measurements.
