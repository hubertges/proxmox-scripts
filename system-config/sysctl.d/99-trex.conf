# /etc/sysctl.d/99-trex.conf
# Cisco TRex & High-Performance Network Testing Tuning for Debian 13 (Trixie)
# Academic Research Lab: SOHO vs Enterprise Network Performance Analysis

# ------------------------------------------------------------------------------
# 1. Memory and Hugepages Optimization
# ------------------------------------------------------------------------------
# Allocate 2048 x 2MB hugepages (4096 MB total). DPDK relies on contiguous
# physical memory spaces to prevent TLB misses during high-packet-rate DMA operations.
vm.nr_hugepages = 2048

# Prevent memory compaction stalls during high packet rates
vm.compact_unevictable_allowed = 0
vm.swappiness = 10
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Allow DPDK and memory-mapped IO to allocate sufficient memory maps
vm.max_map_count = 1000000

# ------------------------------------------------------------------------------
# 2. Kernel Network Stack Buffers (Control Plane & Fallback Socket Drivers)
# ------------------------------------------------------------------------------
# Increase maximum socket buffer sizes to avoid packet drops on management
# and non-DPDK control channels (ZMQ, Scapy, PyBird, TRex Console).
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 33554432
net.core.wmem_default = 33554432
net.core.optmem_max = 2048576

# Maximum number of packets queued on the input side when the interface receives
# packets faster than the kernel can process them.
net.core.netdev_max_backlog = 100000

# Maximum queue length of pending TCP connections
net.core.somaxconn = 65535

# Increase Linux network socket TCP buffer limits (min, default, max in bytes)
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# ------------------------------------------------------------------------------
# 3. IP Routing & Filtering Rules
# ------------------------------------------------------------------------------
# Enable IPv4 forwarding for multi-homed lab setups and routing emulation
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Disable reverse path filtering (Strict Mode = 1 drops asymmetric packets;
# in lab testing with generator ports, asymmetric routing or PBR is common).
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0

# Disable ICMP redirect acceptance and sending (prevents routing distortion)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0

# Disable TCP Timestamps for deterministic microsecond latency testing
net.ipv4.tcp_timestamps = 0
net.ipv4.tcp_sack = 1

# ------------------------------------------------------------------------------
# 4. File Descriptors and IPC Limits
# ------------------------------------------------------------------------------
fs.file-max = 2097152
fs.nr_open = 2097152

# Disable RT throttling to allow real-time threads to consume 100% of isolated cores
kernel.sched_rt_runtime_us = -1
