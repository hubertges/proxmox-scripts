# system-config/cpu-affinity.conf
# CPU Core Affinity & NUMA Topology Guide for Cisco TRex Benchmarking

# ------------------------------------------------------------------------------
# 1. CORE ASSIGNMENT PRINCIPLES
# ------------------------------------------------------------------------------
# TRex uses multiple types of execution threads:
# 1. Master Thread (master_thread_id):
#    - Handles JSON-RPC / ZMQ communication, console input, statistics aggregation.
#    - Runs on a standard non-isolated core (e.g., Core 0).
# 2. Latency / RX Core (latency_thread_id):
#    - Measures packet transit time, RTT, jitter, flow ordering.
#    - MUST BE PINNED TO A DEDICATED PHYSICAL CORE (not shared with master or traffic cores).
#    - Sharing this core introduces artificial jitter distorting RFC 2544 / RFC 3550 metrics.
# 3. DPDK Worker Threads (threads in dual_if):
#    - Poll-mode drivers executing continuous TX/RX packet loops.
#    - Pin to physical sibling cores on the same NUMA socket as the PCIe NIC cards.
#    - NEVER mix hyper-threads (SMT pairs) between worker threads and OS/latency threads!

# ------------------------------------------------------------------------------
# 2. INTEL / AMD TOPOLOGY INSPECTION COMMANDS
# ------------------------------------------------------------------------------
# Check NUMA node alignment:
#   lscpu | grep -E "Model name|Socket|NUMA|Thread"
#   numactl --hardware
#
# Check NIC NUMA node:
#   cat /sys/bus/pci/devices/<pci_address>/numa_node
# (If returns -1, it is a single-socket system or virtualized Proxmox VM).
#
# Check CPU core topology (physical vs SMT siblings):
#   lscpu --extended=CPU,CORE,SOCKET,NODE

# ------------------------------------------------------------------------------
# 3. EXAMPLE CONFIGURATIONS
# ------------------------------------------------------------------------------
# Example A: 8 vCPUs VM (Proxmox KVM)
# master_thread_id: 0
# latency_thread_id: 1
# threads: [2, 3, 4, 5] (4 traffic generation cores)
#
# Example B: 16-Core Intel Xeon / Core Ultra
# Physical P-Cores: 0, 2, 4, 6, 8, 10, 12, 14
# SMT Siblings:     1, 3, 5, 7, 9, 11, 13, 15
# master_thread_id: 0
# latency_thread_id: 2
# threads: [4, 6, 8, 10, 12, 14]
