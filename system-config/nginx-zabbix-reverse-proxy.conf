# ==============================================================================
# system-config/nginx-zabbix-reverse-proxy.conf
# Production-Ready Nginx Reverse Proxy Configuration for Zabbix 8.0 LTS
#
# Target Container: Your EXISTING/EXTERNAL Nginx container
# Installation Path on Nginx Container: /etc/nginx/conf.d/zabbix.conf
#                                    or /etc/nginx/sites-available/zabbix
# ==============================================================================
#
# QUICK DEPLOYMENT GUIDE:
# ------------------------------------------------------------------------------
# 1. Copy this file to your existing Nginx container:
#    pct push <NGINX_CTID> system-config/nginx-zabbix-reverse-proxy.conf /etc/nginx/conf.d/zabbix.conf
#
# 2. Replace <ZABBIX_CONTAINER_IP> below with the actual IP of your Zabbix LXC.
# 3. Replace 'zabbix.example.local' with your domain or container IP/hostname.
# 4. Reload Nginx on your Nginx container:
#    pct exec <NGINX_CTID> -- nginx -t && pct exec <NGINX_CTID> -- systemctl reload nginx
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Upstream Definition (Zabbix 8.0 Container Web Listener)
# ------------------------------------------------------------------------------
upstream zabbix_backend {
    # Replace <ZABBIX_CONTAINER_IP> with the IP address of your Zabbix container:
    server <ZABBIX_CONTAINER_IP>:8080;
    
    # Maintain open connections to the backend for lower latency
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 2. WebSocket Support Mapping
# (Required for real-time item graphs and dashboard widget updates in Zabbix 7/8)
# If this map already exists in your nginx.conf, you can omit this block.
# ------------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------------------
# 3. HTTP Server Block (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name zabbix.example.local; # <-- Set your FQDN or IP here

    # To automatically redirect all HTTP traffic to HTTPS, uncomment:
    # return 301 https://$host$request_uri;

    # Maximum upload size for importing large Zabbix templates and XML/YAML packages
    client_max_body_size 64M;

    # Timeouts tuned for large database queries and heavy graph/report rendering
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    send_timeout          600s;

    # Reverse Proxy Forwarding Headers
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket Upgrade Headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location / {
        proxy_pass http://zabbix_backend;
        
        # Buffer tuning for Zabbix web interface
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Static assets caching optimization (optional)
    location ~* \.(jpg|jpeg|gif|png|ico|css|js|svg|woff|woff2|ttf)$ {
        proxy_pass http://zabbix_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

