# /etc/security/limits.d/99-hugepages.conf & systemd hugepages definition
# Configuration of Hugepages for Cisco TRex on Debian 13 (Trixie)

# User limits for memory locking (memlock) required by DPDK / TRex
*               soft    memlock         unlimited
*               hard    memlock         unlimited
root            soft    memlock         unlimited
root            hard    memlock         unlimited

# Hugepages mount definition:
# To ensure hugepages are always mounted at /dev/hugepages, Debian systemd mounts
# hugetlbfs automatically. Verify via:
#   mount -t hugetlbfs nodev /dev/hugepages
#
# Persistence via /etc/fstab:
#   nodev /dev/hugepages hugetlbfs pagesize=2M 0 0
#
# Hugepage allocation can be checked via:
#   grep -i huge /proc/meminfo
# Expected minimal parameters:
#   HugePages_Total:    2048
#   Hugepagesize:       2048 kB
